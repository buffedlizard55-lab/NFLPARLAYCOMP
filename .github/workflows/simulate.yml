name: Competition simulation cycle

# Paper-trading competition cycle: runs strategies over verified market data,
# simulates execution, settles trades, updates leaderboard, builds site data.
# No real money, no order placement, read-only market data + simulated trades.

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Number of users (5..1000)"
        required: false
        default: "1000"
      clear:
        description: "Clear ledger and users first (true/false)"
        required: false
        default: "false"
  schedule:
    # Run after data collection cycles.
    # NOTE: GitHub's day-of-week field is 0-6 (Sunday is 0). POSIX also accepts
    # 7 for Sunday, but GitHub rejects the ENTIRE workflow file if a 7 appears
    # here, and the only symptom is a run that fails in 0s with no jobs and no
    # logs. Do not use 7.
    - cron: "22 6,12,18 * * *"
    - cron: "52 22 * * 0,1,4,6"

permissions:
  contents: write

concurrency:
  group: simulate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run competition cycle
        run: |
          USERS="${{ github.event.inputs.users || '1000' }}"
          CLEAR_FLAG=""
          if [ "${{ github.event.inputs.clear }}" = "true" ]; then
            CLEAR_FLAG="--clear"
          fi
          python3 scripts/simulate.py --users "$USERS" $CLEAR_FLAG

      - name: Verify ledger and data integrity
        # Runs every gate in one command: unit tests, hash-chain + verification audit,
        # fetch-manifest audit, and the front-end smoke test. Non-zero exit fails CI.
        run: python3 scripts/test_all.py

      - name: Build site data and docs site
        run: |
          python3 scripts/build_site.py

      - name: Commit competition state and site data
        run: |
          git config user.name "parlaycomp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/competition docs
          if git diff --cached --quiet; then
            echo "No new competition data to commit"
          else
            git commit -m "competition: simulation cycle $(date -u +%Y%m%dT%H%M%SZ) [simulator]"
            git push
          fi
